<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Vite & Gourmand</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #FCD34D; border: none; cursor: pointer; }
        .response { margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Tester l'API Vite & Gourmand</h1>

    <h2>1. Créer un utilisateur</h2>
    <form id="createUserForm">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="test@example.com" required>
        </div>
        <div class="form-group">
            <label>Mot de passe:</label>
            <input type="password" id="password" value="Password123" required>
        </div>
        <div class="form-group">
            <label>Prénom:</label>
            <input type="text" id="prenom" value="Pierre" required>
        </div>
        <div class="form-group">
            <label>Téléphone:</label>
            <input type="text" id="telephone" value="0123456789">
        </div>
        <div class="form-group">
            <label>Ville:</label>
            <input type="text" id="ville" value="Paris">
        </div>
        <button type="submit">Créer utilisateur</button>
    </form>

    <h2>2. Récupérer tous les utilisateurs</h2>
    <button onclick="getUsers()">Afficher les utilisateurs</button>

    <h2>3. Créer un menu</h2>
    <form id="createMenuForm">
        <div class="form-group">
            <label>Titre:</label>
            <input type="text" id="menuTitle" value="Menu Spécial" required>
        </div>
        <div class="form-group">
            <label>Prix par personne:</label>
            <input type="number" id="menuPrice" value="35.50" step="0.01" required>
        </div>
        <div class="form-group">
            <label>Nombre minimum de personnes:</label>
            <input type="number" id="menuPeople" value="4" required>
        </div>
        <button type="submit">Créer menu</button>
    </form>

    <h2>Réponse API:</h2>
    <div class="response" id="response">En attente...</div>

    <script>
        const API_URL = 'http://localhost:8000/api';

        // Créer un utilisateur
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                prenom: document.getElementById('prenom').value,
                telephone: document.getElementById('telephone').value,
                ville: document.getElementById('ville').value,
                pays: 'France',
                adresse_postale: '123 Rue Test',
                role_id: 2
            };

            try {
                const response = await fetch(`${API_URL}/utilisateurs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('response').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Erreur: ' + error.message;
            }
        });

        // Récupérer tous les utilisateurs
        async function getUsers() {
            try {
                const response = await fetch(`${API_URL}/utilisateurs`);
                const result = await response.json();
                document.getElementById('response').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Erreur: ' + error.message;
            }
        }

        // Créer un menu
        document.getElementById('createMenuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                titre: document.getElementById('menuTitle').value,
                nombre_personne_minimum: parseInt(document.getElementById('menuPeople').value),
                prix_par_personne: parseFloat(document.getElementById('menuPrice').value),
                regime: 'Classique',
                description: 'Menu délicieux'
            };

            try {
                const response = await fetch(`${API_URL}/menus`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('response').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Erreur: ' + error.message;
            }
        });
    </script>
</body>
</html>
